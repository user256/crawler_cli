name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      COVERAGE_DIR: coverage
      COVERAGE_FILE: coverage/coverage-${{ matrix.python-version }}.data

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests with coverage
        run: |
          mkdir -p "$COVERAGE_DIR"
          pytest -x -q --tb=short -m "not playwright_smoke" --cov=crawler_cli --cov-report=term-missing --cov-report=xml:${COVERAGE_DIR}/coverage-${{ matrix.python-version }}.xml --cov-fail-under=60

      - name: Assert coverage artifacts exist
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("coverage/coverage-${{ matrix.python-version }}.data"),
              Path("coverage/coverage-${{ matrix.python-version }}.xml"),
          ]
          missing = [str(path) for path in paths if not path.exists()]
          empty = [str(path) for path in paths if path.exists() and path.stat().st_size == 0]
          if missing or empty:
              problems = []
              if missing:
                  problems.append(f"missing: {', '.join(missing)}")
              if empty:
                  problems.append(f"empty: {', '.join(empty)}")
              raise SystemExit("; ".join(problems))
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage/
          if-no-files-found: error

  integration:
    name: "Integration tests (Postgres)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run integration tests
        env:
          CRAWLER_CLI_TEST_DSN: "postgresql://crawler:crawler@localhost:5432/crawler_test"
        run: pytest -x -q --tb=short -m integration

  playwright-smoke:
    name: "Playwright smoke (real Chromium)"
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[test,playwright]"

      - name: Resolve Playwright browser cache key
        id: playwright-meta
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import playwright

          version = importlib.metadata.version("playwright")
          browsers_json = Path(playwright.__file__).resolve().parent / "driver" / "package" / "browsers.json"
          data = json.loads(browsers_json.read_text(encoding="utf-8"))
          chromium = next(browser for browser in data["browsers"] if browser["name"] == "chromium")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"playwright_version={version}\n")
              fh.write(f"chromium_revision={chromium['revision']}\n")
          PY

      - name: Cache supported Chromium
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright-meta.outputs.playwright_version }}-${{ steps.playwright-meta.outputs.chromium_revision }}

      - name: Install supported Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: pytest -x -q --tb=short --run-playwright-smoke -m playwright_smoke tests/test_playwright_smoke.py

  lint:
    name: "Lint & typecheck"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: pip install -e ".[test]" ruff mypy

      - name: ruff lint
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

      - name: mypy
        run: mypy src/crawler_cli

  packaging:
    name: "Build & metadata check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine metadata check
        run: twine check dist/*

      - name: Assert packaging metadata
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          with zipfile.ZipFile(wheels[0]) as zf:
              metas = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")]
              assert len(metas) == 1, metas
              meta = zf.read(metas[0]).decode()
          for needle in (
              "Name: crawler-cli",
              "License: MIT",
              "Requires-Python: >=3.11",
              "Project-URL: Homepage, https://github.com/user256/crawler_cli",
              "Project-URL: Repository, https://github.com/user256/crawler_cli",
              "Project-URL: Changelog, https://github.com/user256/crawler_cli/blob/master/CHANGELOG.md",
              "Classifier: Programming Language :: Python :: 3.11",
              "Classifier: Programming Language :: Python :: 3.12",
              "Provides-Extra: playwright",
              "Provides-Extra: intent",
              "Provides-Extra: embeddings-local",
              "Provides-Extra: ann",
              "Provides-Extra: test",
          ):
              assert needle in meta, f"missing {needle!r} in wheel METADATA"

          with tarfile.open(sdists[0], "r:gz") as tf:
              names = tf.getnames()
          assert any(n.endswith("/LICENSE") for n in names), "LICENSE missing from sdist"
          assert any("/tests/" in n for n in names), "tests/ missing from sdist"
          assert not any("/tickets/" in n for n in names), "tickets/ leaked into sdist"
          assert not any("/runs/" in n for n in names), "runs/ leaked into sdist"
          print("packaging metadata OK")
          PY

  extras:
    name: "Extras install (${{ matrix.extra }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: base
            install: "."
            import_check: "import crawler_cli"
          - extra: playwright
            install: ".[playwright]"
            import_check: "import playwright; import crawler_cli"
          - extra: intent
            install: ".[intent]"
            import_check: "import trafilatura; import crawler_cli"
          - extra: ann
            install: ".[ann]"
            import_check: "import hnswlib; import crawler_cli"
          - extra: test
            install: ".[test]"
            import_check: "import pytest; import numpy; import crawler_cli"
          # sentence-transformers pulls torch — resolve deps only in CI.
          - extra: embeddings-local
            install: ".[embeddings-local]"
            import_check: ""
            resolve_only: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Resolve or install extra
        run: |
          if [ "${{ matrix.resolve_only }}" = "true" ]; then
            pip install --dry-run "${{ matrix.install }}"
          else
            pip install "${{ matrix.install }}"
            python -c "${{ matrix.import_check }}"
          fi
