[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-cli"
version = "0.1.0"
description = "Reusable async crawler module extracted from PostgreSQLCrawlerWIP"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "asyncpg>=0.29",
  "beautifulsoup4>=4.12",
  "curl_cffi>=0.7.0",
  "defusedxml>=0.7",
  "lxml>=5.2",
]

[project.optional-dependencies]
playwright = [
  "playwright>=1.44",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
crawler-cli = "crawler_cli.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage flags live in the CI test job command, NOT here: putting them in
# addopts would apply the 60% floor to single-file local runs and to the
# integration-only CI job, failing both (ticket-067).
markers = [
    "integration: requires a real PostgreSQL database (set CRAWLER_CLI_TEST_DSN)",
]

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true

[[tool.mypy.overrides]]
module = [
    "crawler_cli.schema",
    "crawler_cli.extract",
    "crawler_cli.detection.analytics",
    "crawler_cli.backends",
    "crawler_cli.persistence",
]
ignore_errors = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line-length enforced by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
