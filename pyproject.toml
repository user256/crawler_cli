[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-cli"
version = "0.1.0"
description = "Reusable async crawler module extracted from PostgreSQLCrawlerWIP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "John Fegan", email = "johnwilliamfegan@gmail.com" },
]
maintainers = [
  { name = "John Fegan", email = "johnwilliamfegan@gmail.com" },
]
keywords = [
  "crawler",
  "seo",
  "async",
  "postgresql",
  "playwright",
  "sitemap",
  "robots",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.10",
  "asyncpg>=0.29",
  "beautifulsoup4>=4.12",
  "curl_cffi>=0.7.0",
  "defusedxml>=0.7",
  "lxml>=5.2",
]

[project.urls]
Homepage = "https://github.com/user256/crawler_cli"
Repository = "https://github.com/user256/crawler_cli"
Issues = "https://github.com/user256/crawler_cli/issues"
Changelog = "https://github.com/user256/crawler_cli/blob/master/CHANGELOG.md"
Documentation = "https://github.com/user256/crawler_cli#readme"
"Release process" = "https://github.com/user256/crawler_cli/blob/master/RELEASING.md"

[project.optional-dependencies]
playwright = [
  "playwright>=1.44",
]
# Intent-signature extraction (ticket 076). trafilatura pulls in lxml (already a
# base dep) for main-text extraction; kept optional so the base install stays
# slim. The intent-overlap flow installs this together with [embeddings-local].
intent = [
  "trafilatura>=1.8",
]
# Local (no-API-key, multilingual) embeddings for the intent-overlap flow
# (ticket 077). torch comes transitively with sentence-transformers. numpy is
# also used by the ticket 079 analysis. Imported lazily with an error naming
# this extra.
embeddings-local = [
  "sentence-transformers>=2.2",
  "numpy>=1.24",
]
# Approximate nearest-neighbour pair search for intent-overlap at scale
# (ticket 081). Imported lazily with an error naming this extra; the exact
# block-wise path is the default and always available.
ann = [
  "hnswlib>=0.7",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # numpy powers the intent-overlap analysis (ticket 079); tests exercise it
  # with small synthetic vectors, so CI needs it even though it ships in the
  # [embeddings-local] extra for end users.
  "numpy>=1.24",
]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
crawler-cli = "crawler_cli.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage flags live in the CI test job command, NOT here: putting them in
# addopts would apply the 60% floor to single-file local runs and to the
# integration-only CI job, failing both (ticket-067).
markers = [
    "integration: requires a real PostgreSQL database (set CRAWLER_CLI_TEST_DSN)",
    "playwright_smoke: real Chromium-backed Playwright smoke tests (run with --run-playwright-smoke)",
    "slow: long-running (e.g. 10k-vector ANN recall evidence, ticket 081)",
]

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true

# Blanket-ignored modules: the noise here is third-party typing
# (BeautifulSoup AttributeValueList unions, curl_cffi overloads), not our
# logic.  persistence.py was removed from this list in ticket-070 — its SQL
# correctness matters too much for a blanket ignore.
[[tool.mypy.overrides]]
module = [
    "crawler_cli.schema",
    "crawler_cli.extract",
    "crawler_cli.detection.analytics",
    "crawler_cli.backends",
]
ignore_errors = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line-length enforced by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
